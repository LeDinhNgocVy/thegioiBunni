<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm quen với Miu Miu</title>
</head>
<body>
    <main>
        <!-- Tiêu đề chính của trang -->
        <h1>Chào mừng đến với thế giới của Miu Miu</h1>
        
        <!-- Hình ảnh (nhớ thay link ảnh của bạn vào src và thêm mô tả ở alt để đạt chuẩn accessibility) -->
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba" alt="Một chú mèo dễ thương đang nằm nghỉ ngơi" width="400">

        <!-- Tiêu đề phụ -->
        <h2>Thông tin về Miu Miu</h2>
        
        <!-- Danh sách không thứ tự (List) -->
        <ul>
            <li><strong>Giống loài:</strong> Mèo Anh lông ngắn</li>
            <li><strong>Tuổi:</strong> 2 tuổi</li>
            <li><strong>Sở thích:</strong> Ăn hạt, ngủ ngày và quậy phá ban đêm</li>
        </ul>

        <h2>Các món ăn khoái khẩu</h2>
        <!-- Danh sách có thứ tự -->
        <ol>
            <li>Pate cá ngừ</li>
            <li>Súp thưởng vị gà</li>
            <li>Cỏ mèo (Catnip)</li>
        </ol>
    </main>
</body>
</html>
